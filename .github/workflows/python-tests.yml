name: NetzwerkMonitor Automated Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pytest installieren
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: NetzwerkMonitor Tests ausführen
        working-directory: ./NetzwerkMonitor
        run: python -m pytest -v
